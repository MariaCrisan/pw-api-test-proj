stages:
  - quality
  - test

default:
  image: docker:27.5.1-cli
  services:
    - name: docker:27.5.1-dind
  variables:
    DOCKER_HOST: tcp://docker:2375
    DOCKER_TLS_CERTDIR: ''
    NPM_CONFIG_CACHE: '$CI_PROJECT_DIR/.npm'
  cache:
    key:
      files:
        - package-lock.json
    paths:
      - .npm/
  before_script:
    - apk add --no-cache nodejs npm
    - node --version
    - npm --version
    - npm ci

quality:
  stage: quality
  script:
    - npm run format:check
    - npm run lint
    - npm run typecheck

test-groups:
  stage: test
  needs: [quality]
  parallel:
    matrix:
      - TEST_GROUP:
          - api
          - kafka
          - e2e
          - contracts
          - negative
          - retry-idempotency
          - smoke-performance
          - consumer-lag-timeout
          - wiremock
  script:
    - npm run services:up
    - npm run services:wait
    - |
      if [ "$TEST_GROUP" = 'kafka' ] || [ "$TEST_GROUP" = 'e2e' ]; then
        export RUN_INTEGRATION_TESTS=true
      fi
      if [ "$TEST_GROUP" = 'wiremock' ]; then
        export RUN_WIREMOCK_TESTS=true
      fi
      npm run "test:$TEST_GROUP"
  after_script:
    - docker compose logs --no-color > docker-compose.log || true
    - docker compose down -v --remove-orphans || true
  artifacts:
    when: always
    expire_in: 14 days
    paths:
      - artifacts/html-report/
      - artifacts/allure-results/
      - test-results/
      - docker-compose.log
