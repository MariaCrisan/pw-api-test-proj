name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      test_group:
        description: Test group to run
        required: true
        default: all
        type: choice
        options:
          - all
          - api
          - kafka
          - e2e
          - contracts
          - negative
          - retry-idempotency
          - smoke-performance
          - consumer-lag-timeout
          - wiremock

permissions:
  contents: read

jobs:
  quality:
    name: Quality checks
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck

  select-test-groups:
    name: Select test groups
    runs-on: ubuntu-latest
    outputs:
      groups: ${{ steps.groups.outputs.groups }}
    steps:
      - id: groups
        shell: bash
        run: |
          selected='${{ inputs.test_group || 'all' }}'
          if [ "$selected" = 'all' ]; then
            echo 'groups=["api","kafka","e2e","contracts","negative","retry-idempotency","smoke-performance","consumer-lag-timeout","wiremock"]' >> "$GITHUB_OUTPUT"
          else
            printf 'groups=["%s"]\n' "$selected" >> "$GITHUB_OUTPUT"
          fi

  test:
    name: ${{ matrix.group }} tests
    needs: [quality, select-test-groups]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        group: ${{ fromJSON(needs.select-test-groups.outputs.groups) }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - run: npm run services:up
      - run: npm run services:wait
      - name: Run test group
        env:
          RUN_INTEGRATION_TESTS: ${{ (matrix.group == 'kafka' || matrix.group == 'e2e') && 'true' || 'false' }}
          RUN_WIREMOCK_TESTS: ${{ matrix.group == 'wiremock' && 'true' || 'false' }}
        run: npm run test:${{ matrix.group }}
      - name: Generate Allure report
        if: always()
        run: npm run report:allure
      - name: Capture Docker diagnostics
        if: always()
        run: docker compose logs --no-color > docker-compose.log
      - name: Publish test reports and service diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-artifacts-${{ matrix.group }}
          path: |
            artifacts/html-report
            artifacts/allure-results
            artifacts/allure-report
            test-results
            docker-compose.log
          if-no-files-found: warn
          retention-days: 14
      - name: Stop services
        if: always()
        run: docker compose down -v --remove-orphans

  aggregate-allure:
    name: Aggregated Allure report
    needs: test
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - run: npm ci
      - name: Download Allure results from test groups
        uses: actions/download-artifact@v4
        with:
          pattern: test-artifacts-*
          merge-multiple: true
      - name: Generate aggregated Allure report
        run: npm run report:allure
      - name: Publish aggregated Allure report
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-aggregated
          path: |
            artifacts/allure-results
            artifacts/allure-report
          if-no-files-found: error
          retention-days: 14
